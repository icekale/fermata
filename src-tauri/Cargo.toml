[package]
name = "fermata"
version = "2.2.0"
description = "A break timer that holds the note, then lets you continue"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "tray-icon",
  "image-png",
  "macos-private-api",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
sys-locale = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
